name: 补齐大体积音频

# 为什么要有这个工作流：
#   本机上行链路对 7MB 以上的单次 HTTP 提交不稳定 —— REST 建 blob 会在 ~60 秒时
#   被截断（400 malformed），git push 则报 408 RPC failed。小文件不受影响。
#   于是让 Actions 从本地服务器的公网入口直接拉取后提交：它跑在 GitHub 机房，
#   上行不是瓶颈，且下载完会比对 sha256，半截文件提交不进来。
on:
  workflow_dispatch:
    inputs:
      files:
        description: 要同步的文件（相对 audio/ 的路径，逗号分隔）
        required: true
        default: music/06_LCK2025.mp3
      base:
        description: 音频源地址（本地服务器公网入口）
        required: true
        default: https://administrator.taild67b1f.ts.net

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载并校验
        env:
          BASE: ${{ inputs.base }}
          FILES: ${{ inputs.files }}
        run: |
          set -euo pipefail

          # 期望校验和：下载后比对，避免把半截文件提交进去。
          # 新增文件时在这里补一行，值用 sha256sum 本地算。
          declare -A SHA=(
            ["music/06_LCK2025.mp3"]="e1ff638fbc4731a55d8fd890e99bde1b32df2993b1e40fff40d2b48b0bc7400c"
          )

          for f in $(echo "$FILES" | tr ',' ' '); do
            [ -z "$f" ] && continue
            out="audio/$f"
            mkdir -p "$(dirname "$out")"
            echo "→ $out"

            curl -fL --retry 5 --retry-all-errors --retry-delay 5 \
                 --connect-timeout 30 --max-time 900 \
                 -o "$out.tmp" "$BASE/audio/$f"

            got=$(sha256sum "$out.tmp" | cut -d' ' -f1)
            want="${SHA[$f]:-}"
            if [ -n "$want" ] && [ "$got" != "$want" ]; then
              echo "::error::校验和不符 $f —— 期望 $want，实际 $got"
              exit 1
            fi
            echo "  ✓ $(stat -c%s "$out.tmp") 字节  sha256 ${got:0:12}…"
            mv "$out.tmp" "$out"
          done

      - name: 提交
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A audio
          if git diff --cached --quiet; then
            echo "内容无变化，跳过提交"
            exit 0
          fi
          git commit -m "补齐音频：${{ inputs.files }}（经 Actions 拉取）"
          git push
